[project]
name = "rgi-toolkit"
version = "0.4.0"
description = "Restraint-Guided Inference toolkit for PyTorch/JAX-based structure prediction models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml>=6",
    "rdkit>=2024.3.2",
    # Reference structure I/O and sequence alignment; imported lazily when used.
    "gemmi>=0.6.5",
    "biopython>=1.84",
    # Process-safe publication of the optional monomer-library cache.
    "filelock>=3",
]

[project.optional-dependencies]
# PyTorch backend; CUDA bindings enable native solver graph control flow on Linux.
torch = [
    "torch>=2.2",
    "cuda-bindings>=12.8,<13; sys_platform == 'linux'",
]
# JAX backend (alphafold3). Pure JAX CG by default; jaxopt for optional L-BFGS.
jax = [
    "jax",
    "jaxlib",
    "jaxopt",
]
# Optional Colab/Jupyter controls; the engine does not import notebook widgets.
notebook = [
    "ipywidgets>=8,<9",
    "ipython>=8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8",
    "scipy==1.17.1",
    "ruff>=0.15.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Install CPU-only torch to keep CI image small and fast
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pycodestyle]
# Keep the FORMATTER at line-length 88 (code stays wrapped) but let E501 tolerate the
# codebase's dense long-form COMMENT style up to 120, rather than rewrapping ~160 prose
# lines or scattering noqa. Code line length is enforced by the formatter, not E501.
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (deselect with '-m \"not gpu\"')",
    "cpu_compile: verifies real Torch CPU compilation, defaults, and fallback",
]
