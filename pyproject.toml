[project]
name = "rgi-toolkit"
version = "0.1.0"
description = "Restraint-Guided Inference toolkit for PyTorch/JAX-based structure prediction models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml>=6",
    "rdkit>=2024.3.2",
    # RMSD-reference structure I/O (pdb_ref.py) + sequence alignment (_align.py). Both are
    # imported lazily inside their modules so `import rgi_toolkit` stays numpy-only. Loose
    # lower bounds: the host tool venvs pin gemmi 0.6.5-0.7.5 and biopython 1.84-1.87.
    "gemmi>=0.6.5",
    "biopython>=1.84",
    # Process-safe publication of the optional monomer-library cache.
    "filelock>=3",
]

[project.optional-dependencies]
# PyTorch backend (boltz, protenix). Uses torch.optim.LBFGS — no extra optimizer dep.
torch = [
    "torch>=2.2",
]
# JAX backend (alphafold3). Pure JAX CG by default; jaxopt for optional L-BFGS.
jax = [
    "jax",
    "jaxlib",
    "jaxopt",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scipy==1.17.1",
    "ruff>=0.15.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Install CPU-only torch to keep CI image small and fast
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pycodestyle]
# Keep the FORMATTER at line-length 88 (code stays wrapped) but let E501 tolerate the
# codebase's dense long-form COMMENT style up to 120, rather than rewrapping ~160 prose
# lines or scattering noqa. Code line length is enforced by the formatter, not E501.
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (deselect with '-m \"not gpu\"')",
]
