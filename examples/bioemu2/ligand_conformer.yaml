entities:
  - entity_type: protein
    sequence: GYDPETGTWG
    asym_ids: A
  - entity_type: ligand
    smiles: "O=C(O)/C=C/[C@@H](O)C"
    asym_ids: L
    conformer_restraints: true
restraints_config:
  gpu: true
  verbose: true
  method: CG
  max_iter: 100
  conformer_restraints_config:
    start_sigma: 1.0
    bond: {weight: 1}
    angle: {weight: 1}
    chiral: {weight: 1}
    cistrans: {weight: 1}
    vdw: {weight: 1}
