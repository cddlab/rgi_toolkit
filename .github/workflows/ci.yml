name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [eager, compiled]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true       # cache ~/.cache/uv keyed on uv.lock
      - name: Install dependencies
        # `--extra torch` pulls the CPU-only wheel (see the pytorch-cpu index in
        # pyproject.toml): the torch backend is the primary one (boltz / protenix /
        # chai / esmfold2). Install JAX too so AF3 and backend parity tests run.
        run: uv sync --frozen --extra torch --extra jax --extra notebook
      - name: Test eager execution
        if: matrix.mode == 'eager'
        env:
          RGI_DISABLE_COMPILE: "1"
        run: uv run --no-sync pytest -m "not gpu and not cpu_compile" -n 2 --dist loadfile --durations=15
      - name: Test CPU compilation
        if: matrix.mode == 'compiled'
        env:
          RGI_DISABLE_COMPILE: "0"
        run: uv run --no-sync pytest -m "not gpu and cpu_compile" --durations=15
