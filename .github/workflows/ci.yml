name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      RGI_DISABLE_COMPILE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true       # cache ~/.cache/uv keyed on uv.lock
      - name: Install dependencies
        # `--extra torch` pulls the CPU-only wheel (see the pytorch-cpu index in
        # pyproject.toml): the torch backend is the primary one (boltz / protenix /
        # chai / esmfold2). Install JAX too so AF3 and backend parity tests run.
        run: uv sync --frozen --extra torch --extra jax --extra notebook
      - name: Test important CPU contracts
        run: uv run --active --no-sync python -m pytest @tests/ci.txt -m "not gpu" -n 2 --dist loadfile --strict-markers --durations=10
