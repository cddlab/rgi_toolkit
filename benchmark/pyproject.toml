[project]
name = "rgi-benchmark"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "rgi-toolkit",
  "pyyaml>=6",
  "numpy>=1.26",
  "gemmi>=0.6.5",
  "rdkit>=2024.3.2",
  "huggingface-hub>=0.23",
  "filelock>=3",
  "biopython>=1.84",
  "fsspec[http]>=2024.6",
  "posebusters>=0.6",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.uv]
package = false

[tool.uv.sources]
rgi-toolkit = { path = "..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["data", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
